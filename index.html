<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexicon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav id="navbar"></nav>
  <main id="content">
    <h1>Loading...</h1>
    <p>Please wait while the lexicon loads.</p>
  </main>

  <script>
    const lexiconFiles = [
      "lexicons/art-autonomy.md",
      "lexicons/prefigurative-politics.md",
      "lexicons/commons.md"  
    ];

    const navbar = document.getElementById("navbar");
    const content = document.getElementById("content");

    async function loadLexicon(file) {
      const response = await fetch(file);
      const text = await response.text();

      // Split into lines and extract the first non-empty one as title
      const lines = text.split("\n");
      const titleLine = lines.find(line => line.trim().startsWith("#"));
      const title = titleLine ? titleLine.replace(/^#\s*/, "").trim() : "Untitled";
      const body = text.replace(titleLine || "", "").trim();

      // Update content and document title
      document.title = title;
      content.innerHTML = `<h1>${title}</h1><pre>${body}</pre>`;

      // Highlight active tab
      document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
      const active = document.querySelector(`nav a[data-file='${file}']`);
      if (active) active.classList.add("active");

      // Remember last opened lexicon
      localStorage.setItem("lastLexicon", file);
    }

    async function setupNavbar() {
      for (const file of lexiconFiles) {
        const response = await fetch(file);
        const text = await response.text();
        const firstLine = text.split("\n").find(line => line.trim().startsWith("#"));
        const title = firstLine ? firstLine.replace(/^#\s*/, "").trim() : "Untitled";

        const link = document.createElement("a");
        link.href = "#";
        link.textContent = title;
        link.dataset.file = file;
        link.addEventListener("click", (e) => {
          e.preventDefault();
          loadLexicon(file);
        });
        navbar.appendChild(link);
      }

      // Restore last opened lexicon, or default to the first
      const last = localStorage.getItem("lastLexicon");
      await loadLexicon(last && lexiconFiles.includes(last) ? last : lexiconFiles[0]);
    }

    setupNavbar();
  </script>
</body>
</html>
